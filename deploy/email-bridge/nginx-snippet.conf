# OpenAI-CPA email bridge public paths for kaikj.bond (no auth_request).
# Include inside the 443 server block, BEFORE the catch-all `location /`.

location = /api/webhook/email {
    proxy_pass http://127.0.0.1:8820/api/webhook/email;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Webhook-Secret $http_x_webhook_secret;
    proxy_set_header Authorization $http_authorization;
    proxy_request_buffering off;
    client_max_body_size 2m;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

location ^~ /api/email-bridge/ {
    proxy_pass http://127.0.0.1:8820;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Webhook-Secret $http_x_webhook_secret;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Optional legacy grok paths
location = /webhook {
    proxy_pass http://127.0.0.1:8820/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Webhook-Token $http_x_webhook_token;
    proxy_set_header X-Webhook-Secret $http_x_webhook_secret;
    client_max_body_size 2m;
}

location ^~ /check/ {
    proxy_pass http://127.0.0.1:8820;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Webhook-Secret $http_x_webhook_secret;
}

location ^~ /ws/ {
    proxy_pass http://127.0.0.1:8820;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
