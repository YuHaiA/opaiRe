# Rendered by install.sh/install-panel.sh. Include inside the target HTTPS server.

location = __MIHOMO_URL_PATH__ {
    return 302 __MIHOMO_URL_PATH__/;
}

# Keep advanced dashboard on the core controller UI path.
location ^~ __MIHOMO_URL_PATH__/ui/ {
    auth_basic "Mihomo";
    auth_basic_user_file /etc/nginx/mihomo.htpasswd;
    proxy_pass http://127.0.0.1:9090/ui/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

# Primary simple subscription console (same UX as local 127.0.0.1:19099).
location ^~ __MIHOMO_URL_PATH__/ {
    auth_basic "Mihomo";
    auth_basic_user_file /etc/nginx/mihomo.htpasswd;
    proxy_pass http://127.0.0.1:19099/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
