# Simple panel (local-style): https://tupai.cyou/mihomo/
# Advanced Zashboard UI:      https://tupai.cyou/mihomo/ui/
# Include inside 443 server of tupai.cyou BEFORE location /

location = /mihomo {
    return 302 /mihomo/;
}

# Keep advanced dashboard on the core controller UI path.
location ^~ /mihomo/ui/ {
    proxy_pass http://127.0.0.1:9090/ui/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

# Primary simple subscription console (same UX as local 127.0.0.1:19099).
location ^~ /mihomo/ {
    proxy_pass http://127.0.0.1:19099/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
