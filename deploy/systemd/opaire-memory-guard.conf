[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
# Keep enough RAM outside opaiRe for SSH, Nginx and Mihomo. Percentages adapt
# to the VM size and include Camoufox/Firefox child processes in the cgroup.
MemoryAccounting=true
MemoryHigh=70%
MemoryMax=80%
MemorySwapMax=1G
OOMPolicy=kill
# Treat an unexpected clean exit as a service failure too. This matters when
# the worker is cancelled and systemd records the main process status as 0.
Restart=always
RestartSec=5s
