server {
    listen 80;
    listen [::]:80;
    server_name chlin.bond www.chlin.bond;

    access_log /var/log/nginx/opaire-chlin.access.log;
    error_log /var/log/nginx/opaire-chlin.error.log warn;
    include /etc/nginx/snippets/mihomo-chlin.conf;

    # Keep the console shell available while the Python service restarts.
    location = / {
        root /opt/opaire;
        try_files /index.html =503;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    location /static/ {
        alias /opt/opaire/static/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /api/logs/stream {
        proxy_pass http://127.0.0.1:8000/api/logs/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
